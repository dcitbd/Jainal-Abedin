<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Templates | Jainal Abedin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dashboard.css"><link rel="stylesheet" href="../assets/css/templates.css"></head>
<body><div class="admin-app"><aside class="admin-sidebar" id="adminSidebar"><div class="sidebar-brand"><a href="../index.html" class="brand-logo"><span class="brand-logo-symbol"><i class="fa-solid fa-code"></i></span><span class="brand-logo-text"><strong>JAINAL ABEDIN</strong><small>PORTFOLIO</small></span></a><button class="sidebar-close" id="sidebarClose"><i class="fa-solid fa-xmark"></i></button></div><div class="sidebar-user"><div class="sidebar-avatar">JA<i class="fa-solid fa-circle"></i></div><div class="sidebar-user-info"><strong>Jainal Abedin</strong><span>Administrator</span></div></div><nav class="admin-navigation"><span class="nav-section-title">WORKSPACE</span><a href="dashboard.html" class="admin-nav-link"><span class="nav-link-icon"><i class="fa-solid fa-grid-2"></i></span><span>Dashboard</span></a><a href="customer-viewer.html" class="admin-nav-link active"><span class="nav-link-icon"><i class="fa-solid fa-clone"></i></span><span>Templates</span></a><a href="add-template.html" class="admin-nav-link"><span class="nav-link-icon"><i class="fa-solid fa-square-plus"></i></span><span>Add Template</span></a><span class="nav-section-title">PORTFOLIO</span><a href="../assets/pages/about.html" class="admin-nav-link"><span class="nav-link-icon"><i class="fa-regular fa-user"></i></span><span>About</span></a><a href="../assets/pages/services.html" class="admin-nav-link"><span class="nav-link-icon"><i class="fa-solid fa-briefcase"></i></span><span>Services</span></a><span class="nav-section-title">SYSTEM</span><a href="../assets/pages/contact.html" class="admin-nav-link"><span class="nav-link-icon"><i class="fa-regular fa-envelope"></i></span><span>Messages</span></a></nav><div class="sidebar-footer"><div class="sidebar-status"><span class="status-indicator"></span><span>System Online</span></div><button id="logoutBtn" class="sidebar-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button></div></aside><main class="admin-main"><header class="admin-topbar"><div class="topbar-left"><button id="sidebarToggle" class="sidebar-toggle"><i class="fa-solid fa-bars"></i></button><div class="breadcrumb"><span>Admin</span><i class="fa-solid fa-chevron-right"></i><strong>Templates</strong></div></div></header><div class="admin-content" id="pageContent"></div></main></div><script src="../assets/js/dashboard.js"></script><script src="../assets/js/templates.js"></script><script>document.addEventListener('DOMContentLoaded',function(){const content=document.getElementById('pageContent'),id=new URLSearchParams(location.search).get('id');function renderList(){content.innerHTML='<section class="template-view-header"><div><span class="welcome-label">TEMPLATE LIBRARY</span><h2>Templates</h2><p>Browse and manage reusable customer-facing layouts.</p></div><a href="add-template.html" class="add-project-btn"><i class="fa-solid fa-plus"></i> Add Template</a></section><section class="template-toolbar"><label class="template-search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search templates"></label><div class="template-filters"><select id="categoryFilter"><option value="">All categories</option></select><select id="statusFilter"><option value="">All statuses</option><option value="published">Published</option><option value="draft">Draft</option></select></div></section><section id="templatesGrid" class="templates-grid"></section>';const all=TemplateStore.read(),cat=document.getElementById('categoryFilter');[...new Set(all.map(x=>x.category))].sort().forEach(x=>cat.add(new Option(x,x)));const grid=document.getElementById('templatesGrid');function draw(){const q=search.value.toLowerCase(),c=categoryFilter.value,s=statusFilter.value,rows=TemplateStore.read().filter(x=>(!q||(x.name+x.description+x.tags.join(' ')).toLowerCase().includes(q))&&(!c||x.category===c)&&(!s||x.status===s));grid.innerHTML=rows.map(x=>TemplateStore.templateCard(x)).join('')||'<div class="empty-templates"><i class="fa-solid fa-magnifying-glass"></i><p>No templates match your filters.</p></div>';}search.oninput=categoryFilter.onchange=statusFilter.onchange=draw;TemplateStore.bindDelete(grid,draw);draw();}function renderView(){const x=TemplateStore.read().find(a=>a.id===id);if(!x){content.innerHTML='<div class="not-found"><h2>Template not found</h2><a class="btn-primary" href="customer-viewer.html">Back to templates</a></div>';return;}const preview=x.html||'<div style="font-family:Inter,sans-serif;padding:48px;color:#0f172a"><p style="color:#6366f1;font-weight:700;letter-spacing:2px">' + TemplateStore.escape(x.category).toUpperCase() + '</p><h1 style="font-size:40px">' + TemplateStore.escape(x.name) + '</h1><p style="max-width:550px;color:#64748b;font-size:18px">' + TemplateStore.escape(x.description) + '</p><button style="border:0;border-radius:8px;background:#2563eb;color:#fff;padding:12px 18px">Get started</button></div>';content.innerHTML='<section class="template-view-header"><div><a href="customer-viewer.html" class="template-category"><i class="fa-solid fa-arrow-left"></i> All templates</a><h2>'+TemplateStore.escape(x.name)+'</h2><p>'+TemplateStore.escape(x.description)+'</p></div><div class="template-actions"><a class="btn-secondary" href="add-template.html?id='+x.id+'"><i class="fa-regular fa-pen-to-square"></i> Edit</a><button class="btn-primary" id="deleteCurrent"><i class="fa-regular fa-trash-can"></i> Delete</button></div></section><section class="template-view-layout"><div class="template-live-preview"><iframe sandbox="allow-scripts" srcdoc="'+TemplateStore.escape(preview).replace(/&quot;/g,'&#34;')+'"></iframe></div><aside class="template-meta"><h3>Template details</h3><dl><div><dt>Category</dt><dd>'+TemplateStore.escape(x.category)+'</dd></div><div><dt>Status</dt><dd><span class="template-status '+x.status+'">'+x.status+'</span></dd></div><div><dt>Updated</dt><dd>'+TemplateStore.date(x.updatedAt)+'</dd></div><div><dt>Tags</dt><dd>'+x.tags.map(t=>'<span class="template-tags"><span>'+TemplateStore.escape(t)+'</span></span>').join(' ')+'</dd></div></dl></aside></section>';document.getElementById('deleteCurrent').onclick=()=>{if(confirm('Delete “'+x.name+'”? This cannot be undone.')){TemplateStore.write(TemplateStore.read().filter(a=>a.id!==x.id));location.href='customer-viewer.html';}}}id?renderView():renderList();});</script></body></html>
